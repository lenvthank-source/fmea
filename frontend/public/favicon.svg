<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24242A" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF783E" />
      <stop offset="100%" stop-color="#FF5216" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF682C" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Rounded Squircle Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#3E3E48" stroke-width="1.5" />
  
  <!-- Bold Geometric 'F' Lettermark -->
  <path d="M16 16 h24 v7 h-16 v8 h13 v7 h-13 v14 h-8 z" fill="#FFFFFF" />
  
  <!-- Ventriloc Signature Electric Orange Accent Slash -->
